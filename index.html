<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/gif" href="/flowsite-favicon.gif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>FlowSite - Premium Website Builder</title>
    <meta name="description" content="Build stunning websites in minutes with FlowSite. 3D interactive canvas, AI intelligence, and zero-code export." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    
    <style>
      html { background: #020617; }
      body { margin: 0; font-family: 'Poppins', sans-serif; color: white; overflow: hidden; }
      
      #hyper-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: #020617;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s;
      }

      .logo-vortex {
        position: relative;
        font-size: 3rem;
        font-weight: 900;
        letter-spacing: -0.05em;
        text-transform: uppercase;
        animation: logo-reveal 1.5s ease-out forwards;
      }

      .logo-vortex span { color: #7C3AED; }

      .scan-bar {
        width: 200px;
        height: 2px;
        background: rgba(255, 255, 255, 0.05);
        position: relative;
        overflow: hidden;
        border-radius: 4px;
      }

      .scan-bar::after {
        content: '';
        position: absolute;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #7C3AED, transparent);
        animation: scanning 1.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      @keyframes logo-reveal {
        0% { opacity: 0; transform: scale(0.8); filter: blur(20px); }
        100% { opacity: 1; transform: scale(1); filter: blur(0px); }
      }

      @keyframes scanning {
        0% { left: -100%; }
        100% { left: 100%; }
      }

      .bg-blur {
        position: absolute;
        width: 400px;
        height: 400px;
        background: #7C3AED;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.15;
        animation: orbit 8s linear infinite;
      }

      @keyframes orbit {
        from { transform: rotate(0deg) translateX(100px) rotate(0deg); }
        to { transform: rotate(360deg) translateX(100px) rotate(-360deg); }
      }
    </style>
  </head>
  <body>
    <div id="hyper-loader">
      <div class="bg-blur"></div>
      <div class="logo-vortex">FLOW<span>SITE</span></div>
      <div class="scan-bar"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      function clearLoader() {
        const loader = document.getElementById('hyper-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          document.body.style.overflow = 'auto';
          setTimeout(() => loader.remove(), 1000);
        }
      }

      // Instant fix for blank screen: Hide as soon as app module loads
      window.addEventListener('load', () => {
        setTimeout(clearLoader, 800);
      });

      // Safety fallback
      setTimeout(clearLoader, 3000);
    </script>
  </body>
</html>
