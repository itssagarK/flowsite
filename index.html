<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/gif" href="/flowsite-favicon.gif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>FlowSite - Premium Website Builder</title>
    <meta name="description" content="Build stunning websites in minutes with FlowSite. 3D interactive canvas, AI intelligence, and zero-code export. Used by 10K+ creators." />
    
    <!-- Social Meta Tags -->
    <meta property="og:title" content="FlowSite - Build Your Digital World" />
    <meta property="og:description" content="The premium website builder for creators. Combine 3D interactive canvases, AI intelligence, and high-performance export in seconds." />
    <meta property="og:image" content="https://flowsite.com/OpenGraph_FlowSite.jpg" />
    <meta name="twitter:image" content="https://flowsite.com/OpenGraph_FlowSite.jpg" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    
    <style>
      /* Critical CSS for initial load */
      html { background: #0F172A; }
      body { margin: 0; font-family: 'Poppins', sans-serif; color: white; }
    </style>
  </head>
  <body>
    <!-- FlowSite Loader -->
    <div class="inline-loader" id="loader">
      <div class="inline-loader__content">
        <div class="inline-loader__title">
          <!-- FlowSite Logo placeholder -->
          <div style="width: 20vw; height: 10vw; background: rgba(255,255,255,0.05); border-radius: 1vw; display: flex; items-center justify-center; font-size: 2vw; font-weight: 900; color: #7C3AED;">
            FS
          </div>
        </div>
        <div class="inline-loader__pct">
          [ BUILDING ... <span id="inline-loader-pct">0</span>% ]
        </div>
        <div class="inline-loader__bar">
          <div class="inline-loader__progress" id="loader-progress"></div>
        </div>
      </div>
    </div>

    <!-- Cookie Banner -->
    <div class="cookie-banner" id="cookie-banner">
      <div class="cookie-banner__text">
        We use cookies to enhance your experience and analyze site traffic. Your privacy matters.
      </div>
      <div class="cookie-banner__actions">
        <button class="cookie-banner__btn cookie-banner__btn--accept" onclick="document.getElementById('cookie-banner').style.display='none'">Accept</button>
        <button class="cookie-banner__btn cookie-banner__btn--decline" onclick="document.getElementById('cookie-banner').style.display='none'">Decline</button>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Simple loader simulation
      (function() {
        const progress = document.getElementById('loader-progress');
        const pct = document.getElementById('inline-loader-pct');
        const loader = document.getElementById('loader');
        let count = 0;
        
        const interval = setInterval(() => {
          count += Math.random() * 15;
          if (count >= 100) {
            count = 100;
            clearInterval(interval);
            setTimeout(() => {
              loader.style.opacity = '0';
              loader.style.visibility = 'hidden';
            }, 500);
          }
          progress.style.width = count + '%';
          pct.innerText = Math.floor(count);
        }, 100);
      })();
    </script>
  </body>
</html>
