<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/gif" href="/flowsite-favicon.gif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>FlowSite - Premium Website Builder</title>
    <meta name="description" content="Build stunning websites in minutes with FlowSite. 3D interactive canvas, AI intelligence, and zero-code export. Used by 10K+ creators." />
    
    <!-- Social Meta Tags -->
    <meta property="og:title" content="FlowSite - Build Your Digital World" />
    <meta property="og:description" content="The premium website builder for creators. Combine 3D interactive canvases, AI intelligence, and high-performance export in seconds." />
    <meta property="og:image" content="https://flowsite.com/OpenGraph_FlowSite.jpg" />
    <meta name="twitter:image" content="https://flowsite.com/OpenGraph_FlowSite.jpg" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    
    <style>
      /* Critical CSS for initial load */
      html { background: #020617; }
      body { margin: 0; font-family: 'Poppins', sans-serif; color: white; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- FlowSite Cinematic Loader -->
    <div class="inline-loader" id="loader">
      <div class="loader-bg"></div>
      <div class="loader-grid"></div>
      <div class="loader-scanline"></div>
      
      <div class="loader-content">
        <div class="loader-header">
          <div class="loader-logo">FLOW<span>SITE</span></div>
          <div class="loader-version">v2.0.4-STABLE / NEURAL ENGINE ACTIVE</div>
        </div>

        <div class="loader-terminal" id="loader-terminal">
          <!-- Lines injected by script -->
        </div>

        <div class="loader-footer">
          <div class="loader-status-text">
            <span id="loader-msg">INITIALIZING SYSTEM...</span>
            <span id="loader-pct-text">0%</span>
          </div>
          <div class="loader-bar-wrap">
            <div class="loader-bar-fill" id="loader-progress"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      (function() {
        const progress = document.getElementById('loader-progress');
        const pctText = document.getElementById('loader-pct-text');
        const msg = document.getElementById('loader-msg');
        const terminal = document.getElementById('loader-terminal');
        const loader = document.getElementById('loader');
        
        const logs = [
          "CONNECTING TO FLOWSITE NEURAL NETWORK...",
          "HANDSHAKE: [SUCCESS]",
          "USER AUTHORIZED: [GUEST_SESSION_ID_042]",
          "INITIALIZING 3D RENDER CANVAS...",
          "LOADING GEOMETRY BUFFERS...",
          "SYNTHESIZING DESIGN PATTERNS...",
          "BOOTING GEMINI AI ADAPTER...",
          "MODEL: [GEMINI-1.5-PRO-VISION]",
          "OPTIMIZING WEBGL FRAGMENT SHADERS...",
          "PRE-RENDERING TEMPLATE MANIFESTS...",
          "ESTABLISHING SECURE EXPORT TUNNEL...",
          "SYNCING LOCAL STORAGE DATA...",
          "FINALIZING ASSET COMPRESSION...",
          "SYSTEM READY. DEPLOYING WORKSPACE."
        ];

        const statusMsgs = [
          "AUTHENTICATING...",
          "BOOTING CANVAS...",
          "INJECTING AI...",
          "SYNTHESIZING DESIGN...",
          "PREPARING SPACE..."
        ];

        let logIndex = 0;
        let count = 0;
        
        function addTerminalLine(text) {
          const line = document.createElement('div');
          line.className = 'terminal-line';
          line.innerHTML = `<span>[${new Date().toLocaleTimeString()}]</span> <span>${text}</span>`;
          terminal.appendChild(line);
          terminal.scrollTop = terminal.scrollHeight;
          if (terminal.childNodes.length > 6) {
            terminal.removeChild(terminal.firstChild);
          }
        }

        const interval = setInterval(() => {
          count += Math.random() * 4 + 1;
          
          // Randomly add logs
          if (Math.random() > 0.7 && logIndex < logs.length) {
            addTerminalLine(logs[logIndex]);
            logIndex++;
          }

          // Update status message
          const msgIndex = Math.floor((count / 101) * statusMsgs.length);
          if (statusMsgs[msgIndex]) msg.innerText = statusMsgs[msgIndex];

          if (count >= 100) {
            count = 100;
            clearInterval(interval);
            addTerminalLine("WORKSPACE INITIALIZED.");
            setTimeout(() => {
              loader.style.opacity = '0';
              loader.style.transform = 'scale(1.1)';
              loader.style.filter = 'blur(20px)';
              setTimeout(() => {
                loader.style.display = 'none';
                document.body.style.overflow = 'auto';
              }, 500);
            }, 800);
          }
          
          progress.style.width = count + '%';
          pctText.innerText = Math.floor(count) + '%';
        }, 120);

        // Initial log
        addTerminalLine("FLOWSITE KERNEL LOADED.");
      })();
    </script>
  </body>
</html>
